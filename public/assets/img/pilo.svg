<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Pilo, la lapa roja copiloto de CeBe Pilot">
  <defs>
    <radialGradient id="pl-red" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FF5A4E"/><stop offset=".6" stop-color="#E0262B"/><stop offset="1" stop-color="#A3141C"/></radialGradient>
    <linearGradient id="pl-wing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E0262B"/><stop offset=".38" stop-color="#FACC15"/><stop offset=".62" stop-color="#22C55E"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="pl-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7DD3FC"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>
    <linearGradient id="pl-beak" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFBF2"/><stop offset="1" stop-color="#E8DCC6"/></linearGradient>
  </defs>
  <!-- ala -->
  <g class="pilo-wing"><path d="M30 64c-9 10-12 26-6 42 4 2 9-1 12-5 6-10 10-22 10-34-5-4-11-5-16-3z" fill="url(#pl-wing)" stroke="#7F1D1D" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M27 82c4 0 8-2 11-5M26 93c4 0 8-2 10-5" stroke="#0F2A6B" stroke-opacity=".35" stroke-width="2" fill="none" stroke-linecap="round"/></g>
  <!-- cuerpo y cabeza -->
  <path d="M60 18c-20 0-34 15-34 35 0 13 5 24 14 32 2 12 9 22 20 25 12-3 19-14 20-26 9-8 14-18 14-31 0-20-14-35-34-35z" fill="url(#pl-red)" stroke="#7F1D1D" stroke-width="2" stroke-linejoin="round"/>
  <!-- penacho -->
  <path d="M46 22c-4-8-1-14 4-16 0 6 2 10 6 12M56 18c0-8 5-12 10-12-2 5-1 9 2 12" fill="#E0262B" stroke="#7F1D1D" stroke-width="2" stroke-linejoin="round"/>
  <!-- cara blanca -->
  <path d="M64 44c10-3 21 2 23 12 2 9-4 16-13 17-9 0-15-6-15-14 0-6 2-12 5-15z" fill="#FFF7EC"/>
  <path d="M68 66c3 1 6 1 9 0M70 70c3 .6 5 .6 7 0" stroke="#E7B8A6" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- ojo -->
  <g class="pilo-eye"><circle cx="74" cy="55" r="6.2" fill="#FDE68A"/><circle cx="74.6" cy="55.2" r="4.4" fill="#111827"/><circle cx="76.2" cy="53.4" r="1.6" fill="#fff"/>
    <rect class="pilo-lid" x="67" y="48" width="14" height="14" rx="7" fill="#FFF7EC" transform="scale(1 0)" transform-origin="74 55"/></g>
  <!-- pico -->
  <path d="M83 56c10 0 17 7 17 17 0 6-3 11-6 13 0-6-3-10-8-11-3-1-6-1-8-3z" fill="url(#pl-beak)" stroke="#6B5B45" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M80 73c4 1 8 3 9 8-4 3-9 3-12 0 0-3 1-6 3-8z" fill="#1F2937" stroke="#0B0F17" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- gafas de aviador -->
  <path d="M30 34c10-9 28-12 44-8 6 1 11 4 15 7" stroke="#7C4A1E" stroke-width="5" fill="none" stroke-linecap="round"/>
  <g stroke="#F2B705" stroke-width="2.6"><circle cx="50" cy="28" r="9" fill="url(#pl-glass)"/><circle cx="70" cy="27" r="9" fill="url(#pl-glass)"/><path d="M59 28h2" stroke-linecap="round"/></g>
  <path d="M45 24c2-2 4-3 7-3M65 23c2-2 4-3 7-3" stroke="#fff" stroke-opacity=".75" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- bufanda de piloto con la bandera -->
  <path d="M42 90c10 5 26 5 36 0l-1 6c-10 5-24 5-34 0z" fill="#fff"/>
  <path d="M42 90c10 5 26 5 36 0l-.4 2.2c-10 4.6-25 4.6-35.2 0zM43 95.2c10 4.6 24 4.6 34 0l-.3 1.6c-10 4.6-23.6 4.6-33.4 0z" fill="#002B7F"/>
  <path d="M42.6 92.8c10 4.6 25 4.6 35 0l-.5 2.6c-10 4.6-24 4.6-34 0z" fill="#CE1126"/>
</svg>
